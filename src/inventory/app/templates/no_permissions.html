<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access restricted | SMOभर</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 20% 20%, #1e293b, #0f172a 60%);
            color: #e2e8f0; padding: 24px;
        }
        .card {
            width: min(560px, 100%); background: #1e293b;
            border: 1px solid #334155; border-radius: 18px; padding: 36px;
            box-shadow: 0 24px 60px rgba(2, 6, 23, 0.55); text-align: center;
        }
        .brand {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin-bottom: 26px; letter-spacing: 0.16em;
            text-transform: uppercase; font-size: 12px; color: #94a3b8;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #f87171; }
        .icon {
            width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 50%;
            display: grid; place-items: center; background: rgba(248, 113, 113, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.35); font-size: 26px;
        }
        h1 { font-size: 22px; margin: 0 0 12px; }
        p { color: #cbd5e1; line-height: 1.6; margin: 0 0 10px; }
        .who { color: #94a3b8; font-size: 13px; margin-bottom: 26px; }
        .who strong { color: #e2e8f0; }
        button {
            width: 100%; padding: 12px 18px; border-radius: 10px; cursor: pointer;
            border: 1px solid #334155; background: transparent; color: #e2e8f0;
            font-size: 14px; font-weight: 600;
        }
        button:hover { border-color: #64748b; }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand"><span class="dot"></span><span>SMOभर Inventory</span></div>
        <div class="icon" aria-hidden="true">🔒</div>
        <h1>Access restricted</h1>
        <p>You currently do not have permission to access any resources. Please contact an administrator.</p>
        {% if user %}
        <p class="who">Signed in as <strong>{{ user.username }}</strong>{% if user.email %} ({{ user.email }}){% endif %}</p>
        {% endif %}
        <button type="button" id="logoutBtn">Log out</button>
    </main>

    <script>
        document.getElementById("logoutBtn").addEventListener("click", async () => {
            const token = localStorage.getItem("smobhar_session_token")
                || localStorage.getItem("token")
                || "";
            try {
                await fetch("/api/auth/logout", {
                    method: "POST",
                    headers: token ? { "Authorization": "Bearer " + token } : {}
                });
            } catch (err) {}
            localStorage.removeItem("smobhar_session_token");
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            sessionStorage.clear();
            window.location.href = "/login";
        });
    </script>
</body>
</html>
